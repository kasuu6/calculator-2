<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #4a90e2 60%, #50e3c2 100%);
      margin: 0;
      padding: 0;
      color: #333;
    }
    .profile-container {
      max-width: 400px;
      margin: 60px auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      padding: 40px 30px;
      text-align: center;
    }
    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #4a90e2;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .profile-name {
      font-size: 2em;
      font-weight: bold;
      color: #4a90e2;
      margin-bottom: 10px;
    }
    .profile-info {
      font-size: 1.1em;
      margin-bottom: 18px;
      color: #357abd;
    }
    .profile-details {
      background: #f0f4f8;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 10px;
      text-align: left;
      font-size: 1em;
      color: #333;
    }
    .profile-details strong {
      color: #28a745;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #4a90e2;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #357abd;
    }
    /* Floating Chatbot Styles */
    #chatbot-float {
      position:fixed;
      bottom:32px;
      right:32px;
      z-index:9999;
      background:#4a90e2;
      width:60px;
      height:60px;
      border-radius:50%;
      box-shadow:0 4px 16px rgba(0,0,0,0.18);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:box-shadow 0.2s;
    }
    #chatbot-popup {
      position:fixed;
      bottom:100px;
      right:32px;
      z-index:10000;
      width:320px;
      background:#f0f4f8;
      border-radius:16px;
      box-shadow:0 8px 32px rgba(0,0,0,0.18);
      padding:18px;
      display:none;
    }
  </style>
</head>
<body>
  <div class="profile-container">
    <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="User Avatar" class="profile-avatar">
    <div class="profile-name">John Doe</div>
    <div class="profile-info">Goal: <strong>Lose Weight</strong></div>
    <div class="profile-details">
      <div><strong>Age:</strong> 28</div>
      <div><strong>Height:</strong> 175 cm</div>
      <div><strong>Weight:</strong> 72 kg</div>
      <div><strong>BMI:</strong> <span id="bmi-value"></span></div>
    </div>
    <!-- Meal Plan Section -->
    <div style="background:#f0f4f8; border-radius:12px; padding:18px; margin-bottom:18px; text-align:left;">
      <h3 style="color:#357abd; margin-top:0;">Today's Meal Plan</h3>
      <select id="daySelector" style="margin-bottom:12px; padding:6px 12px; border-radius:6px; border:1px solid #4a90e2;">
        <option value="0">Sunday</option>
        <option value="1">Monday</option>
        <option value="2">Tuesday</option>
        <option value="3">Wednesday</option>
        <option value="4">Thursday</option>
        <option value="5">Friday</option>
        <option value="6">Saturday</option>
      </select>
      <div id="meal-plan"></div>
    </div>
    <!-- Progress Tracker with Calendar -->
    <div style="background:#f0f4f8; border-radius:12px; padding:18px; margin-bottom:10px; text-align:left;">
      <h3 style="color:#357abd; margin-top:0;">Progress Tracker</h3>
      <div id="calendar"></div>
      <div id="progress-info" style="margin-top:12px; color:#28a745;"></div>
    </div>
    <!-- AI Chatbot Section -->
    <div style="background:#f0f4f8; border-radius:12px; padding:18px; margin-bottom:10px; text-align:left;">
      <h3 style="color:#357abd; margin-top:0;">AI Chatbot</h3>
      <div id="chatbot-window" style="height:180px; overflow-y:auto; background:#fff; border-radius:8px; border:1px solid #e0e0e0; padding:10px; margin-bottom:10px; font-size:0.98em;"></div>
      <div style="display:flex;">
        <input id="chatbot-input" type="text" placeholder="Ask me about your meal plan, calories, BMI..." style="flex:1; padding:8px; border-radius:6px; border:1px solid #4a90e2;">
        <button onclick="sendChatbotMessage()" style="margin-left:8px; background:#4a90e2; color:#fff; border:none; border-radius:6px; padding:8px 16px; cursor:pointer;">Send</button>
      </div>
    </div>
    <a href="calcu.html" class="back-link">&larr; Back to Calculator</a>
  </div>
  <!-- Floating AI Chatbot Icon -->
  <div id="chatbot-float" style="
    position:fixed;
    bottom:32px;
    right:32px;
    z-index:9999;
    background:#4a90e2;
    width:60px;
    height:60px;
    border-radius:50%;
    box-shadow:0 4px 16px rgba(0,0,0,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:box-shadow 0.2s;
  ">
    <span style="font-size:2em; color:#fff;">💬</span>
  </div>

  <!-- Chatbot Popup -->
  <div id="chatbot-popup" style="
    position:fixed;
    bottom:100px;
    right:32px;
    z-index:10000;
    width:320px;
    background:#f0f4f8;
    border-radius:16px;
    box-shadow:0 8px 32px rgba(0,0,0,0.18);
    padding:18px;
    display:none;
  ">
    <h3 style="color:#357abd; margin-top:0;">AI Chatbot</h3>
    <div id="chatbot-window" style="height:140px; overflow-y:auto; background:#fff; border-radius:8px; border:1px solid #e0e0e0; padding:10px; margin-bottom:10px; font-size:0.98em;"></div>
    <div style="display:flex;">
      <input id="chatbot-input" type="text" placeholder="Ask me about your meal plan, calories, BMI..." style="flex:1; padding:8px; border-radius:6px; border:1px solid #4a90e2;">
      <button onclick="sendChatbotMessage()" style="margin-left:8px; background:#4a90e2; color:#fff; border:none; border-radius:6px; padding:8px 16px; cursor:pointer;">Send</button>
    </div>
  </div>

  <script>
  // Calculate BMI and display
  const heightCm = 175;
  const weightKg = 72;
  const bmi = (weightKg / ((heightCm/100) ** 2)).toFixed(1);
  document.getElementById('bmi-value').textContent = bmi;

  // --- Progress Tracker with Weekly Auto Reset ---
  function getWeekKey() {
    const now = new Date();
    // Get ISO week number
    const jan1 = new Date(now.getFullYear(), 0, 1);
    const days = Math.floor((now - jan1) / (24 * 60 * 60 * 1000));
    const week = Math.floor((days + jan1.getDay() + 1) / 7);
    return `${now.getFullYear()}-W${week}`;
  }

  function renderCalendar() {
    const today = new Date();
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() - today.getDay() + i);
      days.push(d);
    }
    let html = '<table style="width:100%; text-align:center;"><tr>';
    days.forEach(day => {
      html += `<th style="padding:6px; color:#357abd;">${day.toLocaleDateString(undefined, {weekday:'short'})}</th>`;
    });
    html += '</tr><tr>';
    days.forEach(day => {
      html += `<td><input type="checkbox" id="day${day.getDay()}" /></td>`;
    });
    html += '</tr></table>';
    document.getElementById('calendar').innerHTML = html;
  }

  function loadProgress() {
    const weekKey = getWeekKey();
    const saved = JSON.parse(localStorage.getItem('progress-' + weekKey) || '[]');
    for (let i = 0; i < 7; i++) {
      document.getElementById('day'+i).checked = !!saved[i];
    }
    updateProgress();
  }

  function saveProgress() {
    const weekKey = getWeekKey();
    const arr = [];
    for (let i = 0; i < 7; i++) {
      arr[i] = document.getElementById('day'+i).checked ? 1 : 0;
    }
    localStorage.setItem('progress-' + weekKey, JSON.stringify(arr));
  }

  function updateProgress() {
    let checked = 0;
    for (let i = 0; i < 7; i++) {
      if (document.getElementById('day'+i).checked) checked++;
    }
    document.getElementById('progress-info').textContent = `You followed your meal plan ${checked} out of 7 days this week!`;
    saveProgress();
  }

  // Render calendar and load progress for current week
  renderCalendar();
  loadProgress();
  for (let i = 0; i < 7; i++) {
    document.getElementById('day'+i).addEventListener('change', updateProgress);
  }

  // --- Meal Plan Section ---
  const weeklyMealPlans = [
    {
      breakfast: "Oatmeal with Banana (200 kcal)",
      lunch: "Grilled Chicken Salad (350 kcal)",
      dinner: "Salmon, Rice & Veggies (400 kcal)",
      total: 950
    },
    {
      breakfast: "Greek Yogurt & Berries (220 kcal)",
      lunch: "Turkey Sandwich (370 kcal)",
      dinner: "Stir-fried Tofu & Vegetables (410 kcal)",
      total: 1000
    },
    {
      breakfast: "Scrambled Eggs & Toast (250 kcal)",
      lunch: "Quinoa Salad (340 kcal)",
      dinner: "Baked Cod & Sweet Potato (420 kcal)",
      total: 1010
    },
    {
      breakfast: "Fruit Smoothie (180 kcal)",
      lunch: "Chicken Wrap (360 kcal)",
      dinner: "Vegetable Pasta (430 kcal)",
      total: 970
    },
    {
      breakfast: "Peanut Butter Toast (210 kcal)",
      lunch: "Lentil Soup & Bread (350 kcal)",
      dinner: "Grilled Shrimp & Rice (400 kcal)",
      total: 960
    },
    {
      breakfast: "Omelette & Tomato (230 kcal)",
      lunch: "Tuna Salad (360 kcal)",
      dinner: "Chicken Curry & Rice (420 kcal)",
      total: 1010
    },
    {
      breakfast: "Cottage Cheese & Pineapple (200 kcal)",
      lunch: "Veggie Burger (370 kcal)",
      dinner: "Beef Stew & Potato (420 kcal)",
      total: 990
    }
  ];

  function showMealPlanForDay(dayIndex) {
    const plan = weeklyMealPlans[dayIndex];
    document.getElementById('meal-plan').innerHTML = `
      <b>Breakfast:</b> ${plan.breakfast}<br>
      <b>Lunch:</b> ${plan.lunch}<br>
      <b>Dinner:</b> ${plan.dinner}<br>
      <i>Total: ~${plan.total} kcal</i>
    `;
  }

  // Set default to today
  const todayIndex = new Date().getDay();
  document.getElementById('daySelector').selectedIndex = todayIndex;
  showMealPlanForDay(todayIndex);

  document.getElementById('daySelector').addEventListener('change', function() {
    showMealPlanForDay(this.value);
  });

  // Floating chatbot icon toggle
  const chatbotFloat = document.getElementById('chatbot-float');
  const chatbotPopup = document.getElementById('chatbot-popup');
  chatbotFloat.onclick = function() {
    chatbotPopup.style.display = chatbotPopup.style.display === 'none' ? 'block' : 'none';
  };

  // Optional: Close popup when clicking outside
  document.addEventListener('click', function(e) {
    if (
      chatbotPopup.style.display === 'block' &&
      !chatbotPopup.contains(e.target) &&
      !chatbotFloat.contains(e.target)
    ) {
      chatbotPopup.style.display = 'none';
    }
  });

  // --- Simple AI Chatbot ---
  function sendChatbotMessage() {
    const input = document.getElementById('chatbot-input');
    const windowEl = document.getElementById('chatbot-window');
    const userMsg = input.value.trim();
    if (!userMsg) return;
    windowEl.innerHTML += `<div style="margin-bottom:6px;"><b>You:</b> ${userMsg}</div>`;
    input.value = '';

    // Expanded keyword-based responses for nutrition questions
    let response = "I'm here to help! Ask me about your meal plan, calories, BMI, or nutrition facts.";
    if (/bmi|body mass/i.test(userMsg)) {
      response = `Your BMI is <b>${typeof bmi !== 'undefined' ? bmi : 'calculated based on your profile'}</b>.`;
    } else if (/calorie|calories/i.test(userMsg)) {
      response = `Your daily meal plan ranges from <b>950</b> to <b>1010</b> kcal depending on the day.`;
    } else if (/meal plan|breakfast|lunch|dinner/i.test(userMsg)) {
      if (typeof weeklyMealPlans !== 'undefined' && typeof daySelector !== 'undefined') {
        const dayIdx = document.getElementById('daySelector').selectedIndex;
        const plan = weeklyMealPlans[dayIdx];
        response = `<b>Breakfast:</b> ${plan.breakfast}<br><b>Lunch:</b> ${plan.lunch}<br><b>Dinner:</b> ${plan.dinner}<br><i>Total: ~${plan.total} kcal</i>`;
      } else {
        response = "Meal plan details are available in your profile section.";
      }
    } else if (/protein|carb|fat|nutrient|nutrition|vitamin|mineral/i.test(userMsg)) {
      response = "Nutrition facts vary by food. For example, chicken breast is high in protein, rice is rich in carbohydrates, and avocado contains healthy fats. Ask about a specific food for more details!";
    } else if (/apple|banana|chicken|rice|salmon|egg|milk|beef|tofu|pasta|cheese|bread|yogurt|shrimp|cod|potato|vegetable|fruit/i.test(userMsg)) {
      // Example nutritional facts for some foods
      const facts = {
        apple: "An apple (100g) contains ~52 kcal, 0.3g protein, 14g carbs, 0.2g fat.",
        banana: "A banana (100g) contains ~89 kcal, 1.1g protein, 23g carbs, 0.3g fat.",
        chicken: "Chicken breast (100g) contains ~165 kcal, 31g protein, 0g carbs, 3.6g fat.",
        rice: "Cooked white rice (100g) contains ~130 kcal, 2.7g protein, 28g carbs, 0.3g fat.",
        salmon: "Salmon (100g) contains ~208 kcal, 20g protein, 0g carbs, 13g fat.",
        egg: "Egg (1 large) contains ~72 kcal, 6g protein, 0.4g carbs, 5g fat.",
        milk: "Milk (100ml) contains ~42 kcal, 3.4g protein, 5g carbs, 1g fat.",
        beef: "Beef (100g) contains ~250 kcal, 26g protein, 0g carbs, 17g fat.",
        tofu: "Tofu (100g) contains ~76 kcal, 8g protein, 1.9g carbs, 4.8g fat.",
        pasta: "Cooked pasta (100g) contains ~131 kcal, 5g protein, 25g carbs, 1g fat.",
        cheese: "Cheddar cheese (100g) contains ~402 kcal, 25g protein, 1.3g carbs, 33g fat.",
        bread: "White bread (1 slice, ~25g) contains ~67 kcal, 2g protein, 13g carbs, 1g fat.",
        yogurt: "Plain yogurt (100g) contains ~59 kcal, 10g protein, 3.6g carbs, 0.4g fat.",
        shrimp: "Shrimp (100g) contains ~99 kcal, 24g protein, 0.2g carbs, 0.3g fat.",
        cod: "Cod (100g) contains ~82 kcal, 18g protein, 0g carbs, 0.7g fat.",
        potato: "Potato (100g) contains ~77 kcal, 2g protein, 17g carbs, 0.1g fat.",
        vegetable: "Vegetables vary, but are generally low in calories and high in vitamins and minerals.",
        fruit: "Fruits are rich in vitamins, minerals, and fiber, and usually low in fat."
      };
      for (const key in facts) {
        if (userMsg.toLowerCase().includes(key)) {
          response = facts[key];
          break;
        }
      }
    } else if (/hello|hi|hey/i.test(userMsg)) {
      response = "Hello! How can I assist you with your nutrition today?";
    }
    windowEl.innerHTML += `<div style="margin-bottom:10px; color:#357abd;"><b>AI:</b> ${response}</div>`;
    windowEl.scrollTop = windowEl.scrollHeight;
  }
  </script>
</body>
</html>
